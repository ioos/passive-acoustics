name: sync theme submodules

# no permissions by default
permissions: {}

on:
  push:
    branches: gh-pages

  schedule:
     - cron: "00 14 * * *"

  workflow_dispatch:

jobs:
  sync_theme_submodules:
    if: github.repository_owner == 'ioos' # only run if ioos owns repo
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: gh-pages
        fetch-depth: 0
        persist-credentials: false
        submodules: recursive

    - name: check submodule status before
      run: |
          git submodule status

    - name: Update theme from submodules
      id: update_theme_submodule
      run: |
           git submodule update --remote --merge

    - name: check submodule status after
      run: |
           git submodule status

    - name: Create PR if it changed
      # Should be something atteched to the resuts of update_theme_submodule id.
      # if: steps.check_changes.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  #v8.1.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "Update theme"
        branch: "theme_update"
        title: "Update theme submodule"
        body: "This PR updates the theme submodule."
        delete-branch: true
        labels: Bot
